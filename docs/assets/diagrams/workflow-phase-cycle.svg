<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 648" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Phase workflow</title>
  <desc id="d">The orchestrator owns intent and the plan, and sits in the cycle: it opens or audits a
  phase with the phase detailer, and the phase implementer returns a receipt to it. The detailer
  writes the phase document the implementer builds from, and audits the implemented phase. It
  delegates to read-only scouts and reviewers, and the implementer drives one reviewer pass. Work
  that needs writing leaves the cycle for the release, whose orchestrator briefs the writers. Every
  role receives its injected rule sections, the edit guard and on-demand skills through the shared hook.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="648" rx="12" fill="#232434"/>

  <text x="36" y="40" font-size="16" fill="#a3a4b8">Shared hook: injected rules, the edit guard and on-demand skills reach every role</text>

  <rect x="48" y="64" width="520" height="144" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="308" y="90" text-anchor="middle" font-size="16" fill="#ececf2">Orchestrator</text>
  <text x="308" y="112" text-anchor="middle" font-size="14" fill="#a3a4b8">owns intent and the plan</text>
  <text x="308" y="140" text-anchor="middle" font-size="14" fill="#a3a4b8">tools: background agents, plan edits</text>
  <text x="308" y="164" text-anchor="middle" font-size="14" fill="#a3a4b8">skills: plan authoring</text>
  <text x="308" y="188" text-anchor="middle" font-size="14" fill="#a3a4b8">restriction: plan files only</text>

  <rect x="704" y="104" width="208" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="808" y="130" text-anchor="middle" font-size="16" fill="#ececf2">Writers</text>
  <text x="808" y="152" text-anchor="middle" font-size="14" fill="#a3a4b8">release-owned</text>

  <rect x="48" y="288" width="360" height="144" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="228" y="314" text-anchor="middle" font-size="16" fill="#ececf2">Phase detailer</text>
  <text x="228" y="336" text-anchor="middle" font-size="14" fill="#a3a4b8">details and audits a phase</text>
  <text x="228" y="364" text-anchor="middle" font-size="14" fill="#a3a4b8">tools: phase_new, foreground</text>
  <text x="228" y="388" text-anchor="middle" font-size="14" fill="#a3a4b8">skills: plan detailing, UI building</text>
  <text x="228" y="412" text-anchor="middle" font-size="14" fill="#a3a4b8">restriction: plan files only</text>

  <rect x="552" y="288" width="360" height="144" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="732" y="314" text-anchor="middle" font-size="16" fill="#ececf2">Phase implementer</text>
  <text x="732" y="336" text-anchor="middle" font-size="14" fill="#a3a4b8">builds and verifies</text>
  <text x="732" y="364" text-anchor="middle" font-size="14" fill="#a3a4b8">tools: edit, gates, foreground review</text>
  <text x="732" y="388" text-anchor="middle" font-size="14" fill="#a3a4b8">skills: debugging, UI building, docs</text>
  <text x="732" y="412" text-anchor="middle" font-size="14" fill="#a3a4b8">restriction: one phase only</text>

  <rect x="48" y="496" width="360" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="228" y="522" text-anchor="middle" font-size="16" fill="#ececf2">Scouts</text>
  <text x="228" y="544" text-anchor="middle" font-size="14" fill="#a3a4b8">read-only exploration</text>

  <rect x="552" y="496" width="360" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="732" y="522" text-anchor="middle" font-size="16" fill="#ececf2">Reviewers</text>
  <text x="732" y="544" text-anchor="middle" font-size="14" fill="#a3a4b8">read-only, one bounded pass</text>

  <line x1="228" y1="208" x2="228" y2="288" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="236" y="252" font-size="14" fill="#a3a4b8">opens or audits a phase</text>

  <polyline points="732,288 732,264 468,264 468,208" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="276" text-anchor="middle" font-size="14" fill="#a3a4b8">receipt</text>

  <line x1="568" y1="136" x2="704" y2="136" stroke="#a3a4b8"
        stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="636" y="128" text-anchor="middle" font-size="14" fill="#a3a4b8">release path</text>

  <line x1="408" y1="360" x2="552" y2="360" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="352" text-anchor="middle" font-size="14" fill="#a3a4b8">phase document</text>

  <line x1="176" y1="432" x2="176" y2="496" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="184" y="468" font-size="14" fill="#a3a4b8">evidence</text>

  <polyline points="300,432 300,464 660,464 660,496" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="456" text-anchor="middle" font-size="14" fill="#a3a4b8">spec audit</text>

  <line x1="804" y1="432" x2="804" y2="496" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="812" y="468" font-size="14" fill="#a3a4b8">review pass</text>

  <rect x="48" y="576" width="184" height="48" rx="8"
        fill="none" stroke="#4a4c6b" stroke-width="1.5"/>
  <line x1="64" y1="600" x2="104" y2="600" stroke="#a3a4b8"
        stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="116" y="605" font-size="14" fill="#a3a4b8">Release path</text>
</svg>
