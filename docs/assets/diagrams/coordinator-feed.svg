<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Coordinator feed</title>
  <desc id="d">A plan orchestrator's message, its children's reports and its plan changes wait in the
  plan's inbox file. At the end of an orchestrator round the inbox becomes one FEED message in the
  coordinator's conversation. Each linked plan has its own inbox and its own feed message.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="504" rx="12" fill="#232434"/>

  <rect x="48" y="64" width="256" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="176" y="90" text-anchor="middle" font-size="16" fill="#ececf2">Plan orchestrator</text>
  <text x="176" y="112" text-anchor="middle" font-size="14" fill="#a3a4b8">one round</text>

  <rect x="48" y="176" width="256" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="176" y="202" text-anchor="middle" font-size="16" fill="#ececf2">Child sessions</text>
  <text x="176" y="224" text-anchor="middle" font-size="14" fill="#a3a4b8">their final reports</text>

  <rect x="48" y="288" width="256" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="176" y="314" text-anchor="middle" font-size="16" fill="#ececf2">Plan folder</text>
  <text x="176" y="336" text-anchor="middle" font-size="14" fill="#a3a4b8">full plan, touched files</text>

  <rect x="640" y="144" width="240" height="128" rx="8" fill="#2e3045" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="760" y="202" text-anchor="middle" font-size="16" fill="#ececf2">Inbox</text>
  <text x="760" y="224" text-anchor="middle" font-size="14" fill="#a3a4b8">one file per plan</text>

  <rect x="640" y="376" width="240" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="760" y="402" text-anchor="middle" font-size="16" fill="#ececf2">Coordinator</text>
  <text x="760" y="424" text-anchor="middle" font-size="14" fill="#a3a4b8">one FEED per round</text>

  <path d="M304 96 H448 V176 H640" fill="none" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="88" font-size="14" fill="#a3a4b8">messages to the user</text>
  <path d="M304 208 H640" fill="none" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="200" font-size="14" fill="#a3a4b8">shortened reports</text>
  <path d="M304 320 H496 V240 H640" fill="none" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="312" font-size="14" fill="#a3a4b8">plan changes</text>

  <path d="M760 272 V376" fill="none" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="772" y="328" font-size="14" fill="#a3a4b8">at the round end</text>

  <text x="48" y="472" font-size="14" fill="#a3a4b8">Each linked plan has its own inbox and its own feed message.</text>
</svg>
